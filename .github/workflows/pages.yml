name: Deploy FLASH7 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build browser assets
        run: npm run build
      - name: Check application
        run: npm run check
      - name: Package public assets
        run: npm run package:pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: ${{ env.PAGES_ARTIFACT }}
      - name: Wait for uploaded artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts?name=${encodeURIComponent(process.env.PAGES_ARTIFACT)}`;
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(url, {headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
            }});
            if (!response.ok) throw new Error(`Artifact metadata HTTP ${response.status}`);
            const data = await response.json();
            const matches = (data.artifacts || []).filter(item => item.name === process.env.PAGES_ARTIFACT && !item.expired);
            if (matches.length === 1) {
              console.log('Current deployment artifact is available.');
              process.exit(0);
            }
            if (matches.length > 1) throw new Error('Current deployment artifact is duplicated.');
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          throw new Error('Current deployment artifact metadata did not become available.');
          JS
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
