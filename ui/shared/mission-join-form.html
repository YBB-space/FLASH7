<form class="mission-join-form" data-mission-join-form>
  <label>ACCESS CODE<input type="text" data-mission-join-code inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" pattern="[A-Za-z2-9 -]{8,11}" maxlength="11" placeholder="접근 코드 8자리" required></label>
  <button type="submit" data-mission-join>미션 연결</button>
  <p class="mission-join-error" data-mission-join-status role="status" aria-live="polite"></p>
  <details data-mission-relay-settings><summary>중계 서버 설정</summary><label>중계 서버<input type="url" data-mission-join-endpoint placeholder="https://flash7-mission-relay.….workers.dev" required></label><p>처음 연결할 때 송신 PC와 같은 중계 주소를 입력하세요.</p></details>
</form>
