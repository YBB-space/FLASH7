    <section id="desktopSplitEntry" class="split-entry hidden" aria-hidden="true" aria-labelledby="splitEntryTitle" role="dialog" aria-modal="true">
      <div class="split-entry-content">
<!-- @include ui/shared/split-icon.html -->
        <div id="splitEntryIntro">
          <h1 id="splitEntryTitle" tabindex="-1">화면 스플릿</h1>
          <p class="split-entry-description">2개의 화면으로 텔레메트리를 띄울 수 있습니다.</p>
          <button class="split-entry-primary" type="button" data-split-action="start">스플릿 하기</button>
        </div>
        <div id="splitEntryWaiting" class="hidden">
          <h2 id="splitEntryWaitingTitle" tabindex="-1">보조 화면 대기중</h2>
          <div class="split-entry-status" role="status"><i aria-hidden="true"></i><span id="splitEntryStatus">보조 화면 연결을 대기 중입니다.</span></div>
          <div class="split-entry-link">
            <input id="splitEntryLink" type="text" readonly aria-label="보조 화면 연결 링크" spellcheck="false">
            <button type="button" data-split-action="copy">복사</button>
          </div>
          <button class="split-entry-primary" type="button" data-split-action="open">보조 화면 열기</button>
          <button class="split-entry-back" type="button" data-split-action="cancel">돌아가기</button>
        </div>
        <p id="splitEntryError" class="split-entry-error" role="alert"></p>
        <button class="split-entry-skip" type="button" data-split-action="skip">한 화면으로 계속</button>
      </div>
    </section>
